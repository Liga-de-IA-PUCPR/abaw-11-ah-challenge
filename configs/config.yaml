# Raiz da composição Hydra. A ordem importa: _self_ por último deixa os campos
# definidos aqui (seed/device/mode/wandb) sobreporem os defaults dos grupos.
defaults:
  - data: default
  - text_embedder: roberta_emotion   # EN + emoção (README §7/§8)
  - audio_embedder: librosa         # baseline prosódico (CPU); deep = wav2vec2/hubert
  - model: random_forest             # baseline barato; competição = cross_attention
  - trainer: sklearn                 # caminho CPU; neural = lightning
  - aggregation: default
  - vision_embedder: vit_face_expression   # recortes face/olhos/boca (mode=featurize_columns)
  - scene_embedder: videomae               # cena opcional (mode=featurize_columns)
  - override hydra/launcher: joblib  # multirun paralelo (-m)
  - _self_

seed: 42
device: "mps"                       # auto (mps▸cuda▸cpu) | cpu | mps | cuda  (README §3)
mode: "train"                        # train | preprocess | featurize | featurize_face | evaluate | submit
                                     # | hard_mining (lightning) | featurize_columns | oof | route
experiment_name: "abaw-ah"

# Overrides opcionais de CLI por modo (evaluate/submit). null = default do handler
# (split: val em evaluate / test em submit; checkpoint: bundle mais recente em outputs/).
split: null                          # train | val | test
out: null                            # arquivo de submissão (mode=submit)
checkpoint: null                     # caminho do checkpoint (.joblib/.ckpt)
ensemble: null                       # membros p/ mediar probas (evaluate/submit): run dirs ou
                                     # {checkpoint, model, weight, parquet_path} (CA + GNN + face)
ensemble_weights: null               # pesos alinhados a `ensemble` (null = média simples)
# mode=featurize_columns: colunas extras gravadas no Parquet de janelas (src/features/columns.py):
# transcript | asr_timing | hesitation_markers | audio | face_crops | scene
columns: null
# Submissão (formato oficial do desafio BAH). Ver src/outputs/submission.py.
submission_reference: null           # trial-0.txt de referência: define a ORDEM exigida (null = alfabética + aviso)
submission_probabilities: false      # true → 'video_id,p0,p1,pred' (habilita AP); false → 'video_id,pred'

# Protocolo OOF (mode=oof, src/pipeline/oof.py) — régua de toda rodada do plano MoE.
oof:
  splits: [train, val]               # vídeos do protocolo (902; o public test fica de fora)
  n_splits: 5                        # dobras por participante (StratifiedGroupKFold)
  seed: 42                           # MESMAS dobras em todas as rodadas (gate pareado)
  inner_val_frac: 0.15               # holdout interno por participante (early stopping)
  threshold: 0.5                     # τ fixo — nada de calibrar limiar no OOF
  n_boot: 1000                       # reamostras dos ICs por bootstrap
  baseline: null                     # run OOF de referência (outputs/oof/<exp>/<ts>) → gate
  predict_splits: [test]             # splits preditos pelos modelos das dobras (média, sem métricas)

# MoERouter (mode=route, src/pipeline/route.py) — combina membros OOF por amostra (Rodada 6).
route:
  name: moe_router
  members: []                        # runs OOF (outputs/oof/<exp>/<ts>) com as MESMAS dobras
  use_embeddings: true               # vê os vetores pré-logit (false = só os logits)
  proj_dim: 16                       # projeção de cada embedding antes do roteador
  dropout: 0.1
  lr: 1e-2
  weight_decay: 1e-2
  max_epochs: 500                    # full-batch; early stopping no holdout interno
  patience: 50
  inner_val_frac: 0.15
  threshold: 0.5                     # τ fixo
  n_boot: 1000
  predict_splits: [test]             # aplica o roteador final às saídas por dobra dos membros

# Tracking (FASE 5). W&B primário; Reporter local sempre roda como fallback.
wandb:
  project: "abaw-ah"
  mode: "online"                     # online | offline | disabled
  group: null                        # preenchido em multirun

hydra:
  launcher:
    n_jobs: 1                        # multirun: -m hydra.launcher.n_jobs=4
  run:
    dir: outputs/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
