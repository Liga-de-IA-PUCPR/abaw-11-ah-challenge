# configs/model/stacking_cat_rf.yaml  (family=sklearn — CPU)
# Meta-ensemble reduzido: CatBoost + RF → LogisticRegression (meta)
# Motivação: CatBoost (F1=0.7108) e RF (F1=0.6941) são os dois melhores modelos
# individuais. XGBoost e LightGBM foram removidos para evitar que modelos mais
# fracos adicionem ruído ao meta-learner.
name: stacking_cat_rf
family: sklearn

use_catboost: true
use_xgb: false
use_lgbm: false
cv: 5
meta_C: 1.0
n_jobs: -1
random_state: 42

# --- RF base (melhor sweep: F1=0.6941) ---
base_rf_n_estimators: 200
base_rf_max_depth: null
base_rf_min_samples_leaf: 4
base_rf_max_features: sqrt

# --- CatBoost base (melhor sweep: F1=0.7108) ---
cat_n_estimators: 50
cat_depth: 10
cat_learning_rate: 0.1
cat_l2_leaf_reg: 7.0
