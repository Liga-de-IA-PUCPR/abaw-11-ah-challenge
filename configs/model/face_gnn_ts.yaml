# configs/model/face_gnn_ts.yaml — classificador isolado Face Mesh GCN (GNN4TS)
name: face_gnn_ts
family: lightning
dim_tab: 74
use_tabular: true
tab_hidden: 32
# Features de suporte: mean = média crua → Linear (original); late = BN → proj → atenção-MIL.
tab_fusion: mean
tab_pool: attention
dropout: 0.1
lr: 1e-3
weight_decay: 1e-2
pos_weight: auto
contrastive:
  enabled: false
  lambda_supcon: 0.1
  temperature: 0.07
loss:
  type: bce
  gamma: 2.0
  alpha: 0.25
face:
  enabled: true                 # false = só features de suporte (controle de ablação)
  top_k: 8
  spatial_hidden: 64
  spatial_out: 64
  temporal_hidden: 64
  temporal_out: 128
  temporal_mode: gnn4ts
  use_velocity: true
  roi: full
  landmark_stride: 1
  max_windows: null
