# @package _global_
# configs/sweep/catboost.yaml — espaço de busca do CatBoost via Hydra multirun
#
# Uso:
#   python main.py -m +sweep=catboost
#
# Produto cartesiano: 3 × 3 × 3 × 3 = 81 combinações.
# Para paralelizar: python main.py -m +sweep=catboost hydra.launcher.n_jobs=4
# Requer: uv add catboost

defaults:
  - override /model: catboost
  - override /audio_embedder: librosa
  - override /trainer: sklearn

hydra:
  launcher:
    n_jobs: 4
  sweeper:
    params:
      model.n_estimators: 100,300,500
      model.depth: 4,6,8
      model.learning_rate: 0.01,0.05,0.1
      model.l2_leaf_reg: 1.0,3.0,5.0
