# @package _global_
# configs/sweep/lightgbm.yaml — espaço de busca do LightGBM via Hydra multirun
#
# Uso:
#   python main.py -m +sweep=lightgbm
#
# Produto cartesiano atual: 4 × 3 × 3 × 3 = 108 combinações.
#
# Para paralelizar:
#   python main.py -m +sweep=lightgbm hydra.launcher.n_jobs=4
#
# Para busca mais rápida, comente linhas do params ou reduza os valores.

defaults:
  - override /model: lightgbm
  - override /audio_embedder: librosa
  - override /trainer: sklearn

hydra:
  launcher:
    n_jobs: 4
  sweeper:
    params:
      model.n_estimators: 100,200,300,500
      model.num_leaves: 31,63,127
      model.learning_rate: 0.01,0.05,0.1
      model.min_child_samples: 10,20,40
