# @package _global_
# HeteroGAT contrastive no parquet com blocos Luiz (d_tab=74).
# Pré-requisito: +experiment=featurize_deep mode=featurize (+data.force=true se cache antigo).
defaults:
  - override /model: hetero_gnn_contrastive
  - override /audio_embedder: wav2vec2
  - override /text_embedder: roberta_emotion
  - override /trainer: lightning

experiment_name: hetero-gnn-v2

model:
  dim_tab: 74
  gat_num_layers: 2

data:
  num_workers: 4
  batch_size: 32
  tabular:
    use_hesitation: true
    use_text_features: true

aggregation:
  calibration: smooth    # melhor generalização p/ GNN neste dataset (vs base_rate do luiz/RF)

text_embedder:
  batch_size: 16

trainer:
  max_epochs: 500
  patience: 30
  monitor: val_f1_macro
  mode: max
