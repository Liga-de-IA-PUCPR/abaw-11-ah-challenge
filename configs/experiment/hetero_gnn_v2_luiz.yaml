# @package _global_
# HeteroGAT + features de suporte Luiz (late fusion dedicada, sem esmagar embeddings).
# Inspirado no cross-attention do Luiz: tab_pool=attention, regularização moderada.
defaults:
  - override /model: hetero_gnn_contrastive
  - override /audio_embedder: wav2vec2
  - override /text_embedder: roberta_emotion
  - override /trainer: lightning

experiment_name: hetero-gnn-v2-luiz

model:
  dim_tab: 74
  gat_num_layers: 2
  use_tab_enhanced: true       # ramo paralelo: GAT em áudio↔texto, tab_encoder separado
  tab_pool: attention          # MIL atenção nas janelas (como tab_fusion=token do Luiz)
  dropout: 0.22
  lr: 3e-4
  weight_decay: 0.03
  contrastive:
    enabled: true
    lambda_supcon: 0.05        # leve — não competir com o sinal tabular

data:
  num_workers: 4
  batch_size: 24
  tabular:
    use_hesitation: true
    use_text_features: true

aggregation:
  calibration: smooth        # generaliza melhor que base_rate p/ GNN (base_rate → thr≈0.07)

text_embedder:
  batch_size: 16

trainer:
  max_epochs: 500
  patience: 35
  monitor: val_f1_macro
  mode: max
