# @package _global_
# Cross-attention Luiz com áudio librosa + tabular de suporte (d_tab=74).
# dim_a inferido do parquet no fit (~356 prosódico vs 768 wav2vec2).
defaults:
  - override /model: cross_attention
  - override /audio_embedder: librosa
  - override /text_embedder: roberta_emotion
  - override /trainer: lightning

experiment_name: cross-attention-luiz-librosa

data:
  paths:
    parquet_path: data/processed/text_audio_windows_librosa.parquet
  tabular:
    use_hesitation: true
    use_text_features: true

aggregation:
  calibration: base_rate

text_embedder:
  batch_size: 16

trainer:
  max_epochs: 400
  patience: 20
  monitor: val_ap
  mode: max
