# @package _global_
# Preset competição: modelo multimodal completo
defaults:
  - override /model: multimodal_hetero_full
  - override /audio_embedder: wav2vec2
  - override /text_embedder: roberta_emotion
  - override /trainer: lightning

experiment_name: abaw-ah-multimodal-full

text_embedder:
  batch_size: 16
s
data:
  num_workers: 8
  batch_size: 64

trainer:
  max_epochs: 5000
  patience: 200
  monitor: val_f1_macro
  mode: max
