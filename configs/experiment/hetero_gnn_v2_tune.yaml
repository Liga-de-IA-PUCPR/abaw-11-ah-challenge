# @package _global_
# HeteroGAT + librosa + smooth + cross-attention Luiz como pesos de aresta.
# - aligns densos: attn áudio→texto (T×T)
# - reports: pesos MIL gated (token tab) janela→vídeo
# - common_dim=512 equilibra d_audio=320 vs d_text=768
defaults:
  - override /model: hetero_gnn_contrastive
  - override /audio_embedder: librosa
  - override /text_embedder: roberta_emotion
  - override /trainer: lightning

experiment_name: hetero-gnn-v2-tune

model:
  dim_tab: 74
  common_dim: 512
  gat_num_layers: 2
  use_tab_enhanced: false
  use_ca_edge_weights: true
  ca_num_heads: 8
  dropout: 0.25
  lr: 3e-4
  weight_decay: 0.04
  contrastive:
    enabled: true
    lambda_supcon: 0.08

data:
  paths:
    parquet_path: data/processed/text_audio_windows_librosa.parquet
  num_workers: 4
  batch_size: 24
  tabular:
    use_hesitation: true
    use_text_features: true

aggregation:
  calibration: smooth

text_embedder:
  batch_size: 16

trainer:
  max_epochs: 500
  patience: 40
  monitor: val_f1_macro
  mode: max
