# @package _global_
# Preset de tuning: hard mining (WeightedRandomSampler) + focal loss.
# Requer rodar antes: mode=hard_mining (gera data/interim/hard_examples.json).
defaults:
  - override /model: multimodal_hetero_full
  - override /audio_embedder: wav2vec2
  - override /text_embedder: roberta_emotion
  - override /trainer: lightning

experiment_name: abaw-ah-multimodal-full-hard

text_embedder:
  batch_size: 16

data:
  num_workers: 6
  batch_size: 16
  hard_examples: data/interim/hard_examples.json

trainer:
  max_epochs: 40
  patience: 15
  monitor: val_f1_macro
  mode: max
  accumulate_grad_batches: 4

model:
  lr: 5e-4
  weight_decay: 5e-3
  dropout: 0.15
  loss:
    type: focal
    gamma: 2.0
    alpha: 0.25
