# @package _global_
# [integração] cache wav2vec2 da main: data/processed/text_audio_windows_w2v.parquet (make featurize-w2v).
# Re-featurização: wav2vec2 + RoBERTa-emotion + hesitation (18) + text_features (49) + qtype (7).
# Resultado esperado: d_tab=74 no parquet (17 → 74 vs baseline sem suporte).
defaults:
  - override /audio_embedder: wav2vec2
  - override /text_embedder: roberta_emotion

experiment_name: featurize-deep-support

data:
  paths:
    parquet_path: data/processed/text_audio_windows_w2v.parquet
  tabular:
    use_hesitation: true
    use_text_features: true
