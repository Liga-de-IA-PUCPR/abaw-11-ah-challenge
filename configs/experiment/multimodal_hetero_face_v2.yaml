# @package _global_
# Ablação v2: branch face menor (sem mudar contrastive/lr)
defaults:
  - /face_embedder: mediapipe
  - override /model: multimodal_hetero_face
  - override /audio_embedder: wav2vec2
  - override /text_embedder: roberta_emotion
  - override /trainer: lightning

experiment_name: abaw-ah-multimodal-face-v2

data:
  num_workers: 6
  batch_size: 16

trainer:
  max_epochs: 2500
  patience: 100
  monitor: val_f1_macro
  mode: max
  accumulate_grad_batches: 4

model:
  face:
    spatial_out: 64
    temporal_out: 64
