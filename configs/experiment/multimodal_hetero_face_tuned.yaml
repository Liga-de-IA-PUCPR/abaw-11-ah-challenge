# @package _global_
# Preset otimizado: face GCN + menos VRAM + sem contrastive (ablação v1)
defaults:
  - /face_embedder: mediapipe
  - override /model: multimodal_hetero_face
  - override /audio_embedder: wav2vec2
  - override /text_embedder: roberta_emotion
  - override /trainer: lightning

experiment_name: abaw-ah-multimodal-face-tuned

text_embedder:
  batch_size: 32

data:
  num_workers: 6
  batch_size: 16

trainer:
  max_epochs: 2500
  patience: 100
  monitor: val_f1_macro
  mode: max
  accumulate_grad_batches: 4

model:
  dropout: 0.15
  contrastive:
    enabled: false
  lr: 5e-4
  weight_decay: 5e-3
  face:
    spatial_out: 64
    temporal_out: 64
