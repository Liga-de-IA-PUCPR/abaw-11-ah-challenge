# @package _global_
# Ablação leve: 3 camadas GAT + focal (sem SWA/cosine agressivo).
defaults:
  - override /model: hetero_gnn_contrastive
  - override /audio_embedder: wav2vec2
  - override /text_embedder: roberta_emotion
  - override /trainer: lightning

experiment_name: hetero-gnn-v2-ablation

model:
  dim_tab: 74
  gat_num_layers: 3
  dropout: 0.15
  loss:
    type: focal
    gamma: 2.0
    alpha: 0.25
    label_smoothing: 0.02
  contrastive:
    enabled: true
    lambda_supcon: 0.12

aggregation:
  calibration: smooth

text_embedder:
  batch_size: 16

data:
  num_workers: 4
  batch_size: 32

trainer:
  max_epochs: 500
  patience: 25
  monitor: val_f1_macro
  mode: max
