# configs/scene_embedder/videomae.yaml — canal de CENA opcional do plano MoE (tracejado).
# VideoMAE congelado sobre num_frames frames uniformes do vídeo INTEIRO (fundo, postura) →
# coluna scene_emb_<name> (1 vetor por vídeo, replicado nas janelas).
# VideoMAE-v2 (OpenGVLab/VideoMAEv2-*) exige código remoto; o v1 abaixo roda com o transformers.
#   python main.py mode=featurize_columns "columns=[scene]" scene_embedder=videomae
name: videomae
model_name: MCG-NJU/videomae-base
num_frames: 16
pooling: mean
