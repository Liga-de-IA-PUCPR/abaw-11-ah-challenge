# Janela → vídeo + calibração de limiar (README §6.5). RF agrega probas de janela;
# cross_attention já prediz 1 logit/vídeo (ainda calibra o limiar do sigmoid).
method: mean_proba                     # mean_proba | max_proba | frac_positive | any
threshold: auto                        # "auto" = calibrado na val; ou float fixo
# Escolha do limiar na val. base_rate (default) = casa a prevalência (quantil), robusto a
# val pequena; smooth = centro do platô da curva F1; argmax = pico cru (overfitta val pequena).
calibration: base_rate
smooth_window: 0.10                    # largura da média móvel (unidades de limiar) p/ 'smooth'
target_pos_rate: null                  # base_rate: prevalência-alvo (null = a observada na val)
recalibrate: false                     # evaluate/submit: recalibra na val (ignora limiar salvo)
metric: macro_f1
