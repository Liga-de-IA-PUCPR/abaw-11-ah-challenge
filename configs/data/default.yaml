# Sub-blocos aninhados: data.paths.*, data.audio.*, data.window.*, data.tabular.
# data_root reflete o layout REAL em disco (pasta data/ aninhada) — branch matheus (README §2).
paths:
  data_root: data/raw/data               # contém Videos/ transcription/ split/ bah-video.csv
  videos_dir: ${data.paths.data_root}/Videos
  transcription_dir: ${data.paths.data_root}/transcription
  split_dir: ${data.paths.data_root}/split            # train.txt / val.txt / test.txt
  annotation_yaml: ${data.paths.data_root}/video_annotation_transcript.yaml
  video_index_csv: ${data.paths.data_root}/bah-video.csv
  # Artefatos derivados
  audio_dir: data/interim/Audio          # .flac 16 kHz mono (extract_audio.py)
  interim_dir: data/interim
  window_index: data/interim/windows.parquet
  processed_dir: data/processed
  parquet_path: data/processed/text_audio_windows.parquet   # cache de features (README §6.2)
  # Parquet usado SÓ p/ (re)calibrar o limiar no evaluate/submit. null = mesmo que
  # parquet_path. Ex.: predizer no externo (parquet_path) e calibrar no raw test rotulado.
  calib_parquet_path: null
  output_root: outputs                   # resolve_output_dir (FASE 5)

# Áudio do pipeline (extração + janelamento). audio_embedder.* usa o MESMO sample_rate.
audio:
  sample_rate: 16000
  mono: true
  extract_backend: ffmpeg                # ffmpeg | torchaudio

# Janela deslizante (README §2: A/H médio ≈ 4,3 s → janela 5 s)
window:
  size_s: 5.0
  hop_s: 2.5                             # 50% de sobreposição
  min_overlap_for_positive: 0.5          # rótulo da janela via time_detailed_ah
  pad_last: true
  label_source: time_detailed_ah

# Features tabulares (FASE 3) — quais grupos habilitar
tabular:
  use_metadata: false
  use_question_type: true
  use_prosody: false
  # Bloco de INCERTEZA/HESITÂNCIA (suporte ao embedding): latência de resposta + pausas
  # + entonação (F0 variável, subida terminal) + volume + jitter/shimmer (via Praat).
  # Alinhado ao construto do BAH (NÃO disfluência). Roda ao lado de QUALQUER
  # audio_embedder (inclusive hubert/wav2vec2). Desligue com use_hesitation=false.
  use_hesitation: true
  hesitation:
    frame_length: 2048
    hop_length: 512
    silence_rms_threshold: 0.1     # fração do RMS máx. p/ frame de silêncio
    top_db: 30.0                   # VAD de pausas (dB abaixo do pico)
    min_pause_s: 0.15              # duração mínima p/ contar uma pausa
    long_pause_s: 0.3              # limiar de pausa "longa" (recalibrado: 0.3 > 0.5 na val)
    f0_min: 65.0                   # faixa de F0 do Praat (Hz)
    f0_max: 500.0
    final_frac: 0.30               # fração final dos frames vozeados p/ a subida terminal de F0
    nuclei_silence_db: 25.0        # piso de silêncio (dB abaixo do pico) p/ núcleos silábicos
    nuclei_min_dip_db: 2.0         # vale mínimo (dB) entre núcleos (de Jong & Wempe)
    use_praat: true                # F0/jitter/shimmer via parselmouth
  # Bloco de TEXTO (ambivalência/hesitância): A1 (índices psicométricos, RESPOSTA) + A3
  # (entropia por janela + flutuação de emoção por resposta) + A4 (contraste + shift) +
  # H1 (hedges). Late fusion (acompanha qualquer text_embedder; vai ao RF e ao ramo tabular
  # do cross-attn). ⚠️ Se text_embedder.fuse_text_features=true (early), NÃO ligar aqui —
  # duplicaria. Desligue com use_text_features=false.
  use_text_features: true
  text_features:
    use_a1: true                 # ambivalência (Griffin/Kaplan de P/N; nível de resposta)
    use_a3: true                 # entropia (janela) + flutuação/conflito de emoção (resposta)
    use_a4: true                 # contraste + shift de polaridade (janela)
    use_h1: true                 # hedges (janela)
    use_emotion: true            # classificador de emoção p/ P/N-emoção (A1) e A3
    use_hedge_classifier: false  # H1 contextual (logreg de supervisão distante) — opcional
    emotion_model: cardiffnlp/twitter-roberta-base-emotion
    positive_labels: [joy, optimism]
    negative_labels: [anger, sadness]
    max_length: 128
    batch_size: 32
    norm: [per_word, per_100, raw]   # normalizações emitidas p/ contagens léxicas

batch_size: 32                           # usado pelo caminho Lightning
num_workers: 0

# Composição de splits (mode=train). Defaults = comportamento anterior (treina em train,
# calibra/monitora em val). Quando a avaliação real é EXTERNA (private test), dá pra usar
# toda a base rotulada: train_splits=[train,val] p/ treinar, calib_split=test (525, grande
# e limpo) p/ calibrar o limiar — sem vazamento (splits são disjuntos por participante).
# ⚠️ NUNCA ponha 'test' em train_splits no caminho sklearn/RF: as janelas de test têm
# rótulo -1 (sem label de janela) e o RF treinaria numa classe espúria.
train_splits: [train]
calib_split: val
