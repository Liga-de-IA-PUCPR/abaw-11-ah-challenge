# Sub-blocos aninhados: data.paths.*, data.audio.*, data.window.*, data.tabular.
# data_root reflete o layout REAL em disco (pasta data/ aninhada) — branch matheus (README §2).
paths:
  data_root: data/raw                    # contém Videos/ transcription/ split/ bah-video.csv
  videos_dir: ${data.paths.data_root}/Videos
  transcription_dir: ${data.paths.data_root}/transcription
  split_dir: ${data.paths.data_root}/split            # train.txt / val.txt / test.txt
  annotation_yaml: ${data.paths.data_root}/video_annotation_transcript.yaml
  video_index_csv: ${data.paths.data_root}/bah-video.csv
  # Artefatos derivados
  audio_dir: data/interim/Audio          # .flac 16 kHz mono (extract_audio.py)
  interim_dir: data/interim
  window_index: data/interim/windows.parquet
  processed_dir: data/processed
  parquet_path: data/processed/text_audio_windows.parquet   # cache de features (README §6.2)
  calib_parquet_path: null
  output_root: outputs                   # resolve_output_dir (FASE 5)

# Áudio do pipeline (extração + janelamento). audio_embedder.* usa o MESMO sample_rate.
audio:
  sample_rate: 16000
  mono: true
  extract_backend: ffmpeg                # ffmpeg | torchaudio

# Janela deslizante (README §2: A/H médio ≈ 4,3 s → janela 5 s)
window:
  size_s: 5.0
  hop_s: 2.5                             # 50% de sobreposição
  min_overlap_for_positive: 0.5          # rótulo da janela via time_detailed_ah
  pad_last: true
  label_source: time_detailed_ah

# Features tabulares (FASE 3) — quais grupos habilitar
tabular:
  use_metadata: false
  use_question_type: true
  use_prosody: false
  use_hesitation: true
  hesitation:
    frame_length: 2048
    hop_length: 512
    silence_rms_threshold: 0.1
    top_db: 30.0
    min_pause_s: 0.15
    long_pause_s: 0.3
    f0_min: 65.0
    f0_max: 500.0
    final_frac: 0.30
    nuclei_silence_db: 25.0
    nuclei_min_dip_db: 2.0
    use_praat: true
  use_text_features: true
  text_features:
    use_a1: true
    use_a3: true
    use_a4: true
    use_h1: true
    use_emotion: true
    use_hedge_classifier: false
    emotion_model: cardiffnlp/twitter-roberta-base-emotion
    positive_labels: [joy, optimism]
    negative_labels: [anger, sadness]
    max_length: 128
    batch_size: 32
    norm: [per_word, per_100, raw]

batch_size: 32
num_workers: 0
featurize_chunk_size: 256
train_splits: [train]
calib_split: val
